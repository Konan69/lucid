name: Quality

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format, typecheck, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://vivid:vivid@localhost:55433/vivid
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: vivid
          POSTGRES_PASSWORD: vivid
          POSTGRES_DB: vivid
        options: >-
          --health-cmd "pg_isready -U vivid -d vivid"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 55433:5432
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # pnpm's cache contains downloads, not successful check results. Task hashes
      # decide reuse after restoring the latest cache for this lockfile.
      - name: Restore Turbo task cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # Runs after the install because the script imports `effect`; before it, Node cannot
      # resolve the package and the job stopped here without checking anything.
      - name: Check package-manager policy
        run: node scripts/package-manager.mjs

      - name: Check version lockstep
        run: pnpm check:versions

      - name: Audit Effect boundaries
        run: pnpm audit:effect-boundaries

      - name: Check migration integrity
        run: pnpm check:migrations

      - name: Test tooling rules
        run: pnpm test:tooling

      - name: Lint with native type analysis
        run: pnpm lint

      - name: Check formatting
        run: pnpm format

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        env:
          VIVID_TEST_DATABASE_URL: postgresql://vivid:vivid@localhost:55433/vivid
        run: pnpm test

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The action lists a pull request's commits to scan them; with only `contents: read` GitHub
    # answered 403 and the scan never ran.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
