name: Quality

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # A commit that passed the gate where it was written carries a commit status named `gate`
  # (scripts/gate/signoff.mjs, posted by the push hook). The gate jobs below are the same stages
  # on cold machines, so they run only for a commit without one: a pull request from elsewhere, a
  # push with no hook. The secret scan does not depend on it and always runs.
  signoff:
    name: Signoff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: read
    outputs:
      signed: ${{ steps.read.outputs.signed }}
    steps:
      - name: Read the gate status of this commit
        id: read
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/statuses" \
            --jq '[.[] | select(.context == "gate")][0].state // "none"')
          echo "gate status: $state"
          if [ "$state" = success ]; then echo "signed=true"; else echo "signed=false"; fi >> "$GITHUB_OUTPUT"

  # The gate is scripts/gate.mjs: its stages are defined in scripts/gate/stages.mjs and the push
  # hook runs the same ones. Each job below is a selection of stages on its own machine, so lint
  # and typecheck, which each hold a whole TypeScript program in memory, run at the same time
  # without sharing one machine's memory.
  checks:
    name: ${{ matrix.name }}
    needs: signoff
    # `!cancelled()`: when the signoff job itself fails there is no answer, and no answer is not
    # a signoff, so the gate runs; without it a failed `needs` skipped the gate. A cancelled run
    # stays cancelled, which `always()` would not allow.
    if: ${{ !cancelled() && needs.signoff.outputs.signed != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # A push to main must compare with its previous tip, even when origin/main is already HEAD.
      CEILINGS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Policy, format and tooling
            stages: policy,format,tooling
          - name: Lint with native type analysis
            stages: lint
          - name: Typecheck
            stages: typecheck
          - name: Production builds
            stages: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Checkout has depth 1. Fetch the comparison object explicitly so lint needs no merge history.
      - name: Fetch the ceiling comparison commit
        if: matrix.stages == 'lint'
        run: |
          case "$CEILINGS_BASE" in
            ""|0000000000000000000000000000000000000000)
              echo "::error::ceilings: this event has no comparison commit. A new branch needs an existing base for --ceilings-base."
              exit 1
              ;;
          esac
          git fetch --no-tags --depth=1 origin "$CEILINGS_BASE"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned celld for Worker builds
        if: matrix.stages == 'build'
        run: |
          curl -fsSL https://celld.dev/install.sh -o "$RUNNER_TEMP/celld-install.sh"
          CELLD_VERSION=v0.6.2 sh "$RUNNER_TEMP/celld-install.sh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/celld" --version

      # pnpm's cache contains downloads, not successful check results. Task hashes decide reuse
      # after restoring the latest cache for this lockfile; each job keeps its own, so a job
      # restores only the results of the stages it runs.
      - name: Restore Turbo task cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ strategy.job-index }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ strategy.job-index }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # Preserve the stage logs when the shell exits on failure. A pass removes the trap;
      # cancellation logs depend on whether the runner lets the shell handle its signal.
      - name: Run the gate stages
        run: |
          trap 'status=$?; cat .cache/gate/runs/*/*.log .turbo/*.log || true; exit $status' EXIT
          node scripts/gate.mjs full --here --only ${{ matrix.stages }} --ceilings-base "$CEILINGS_BASE"
          trap - EXIT

  test:
    name: Test
    needs: signoff
    # `!cancelled()`: when the signoff job itself fails there is no answer, and no answer is not
    # a signoff, so the gate runs; without it a failed `needs` skipped the gate. A cancelled run
    # stays cancelled, which `always()` would not allow.
    if: ${{ !cancelled() && needs.signoff.outputs.signed != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # An administration connection to a disposable server. The gate creates one empty database
      # per run on it and gives that to the suites; without this the gate fails, it does not skip.
      VIVID_TEST_DATABASE_URL: postgresql://vivid:vivid@localhost:55440/postgres
      # A pull request runs the test files whose inputs changed since they last passed. The
      # default branch runs every file and trusts no record, so a dependency the per-file keys
      # cannot see is caught here at the latest.
      VIVID_TEST_ALL: ${{ github.event_name == 'push' && '1' || '0' }}
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: vivid
          POSTGRES_PASSWORD: vivid
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U vivid -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 55440:5432
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Electron refuses to start when its installed setuid sandbox has pnpm's user ownership.
      - name: Configure Electron sandbox
        run: |
          pnpm --dir apps/desktop exec node --input-type=module <<'NODE'
          import path from 'node:path'
          import { execFileSync } from 'node:child_process'
          import electron from 'electron'
          const sandbox = path.join(path.dirname(electron), 'chrome-sandbox')
          execFileSync('sudo', ['chown', 'root:root', sandbox], { stdio: 'inherit' })
          execFileSync('sudo', ['chmod', '4755', sandbox], { stdio: 'inherit' })
          NODE

      # pnpm's cache contains downloads, not successful check results. Task hashes decide reuse
      # after restoring the latest cache for this lockfile; each job keeps its own, so a job
      # restores only the results of the stages it runs.
      - name: Restore Turbo task cache
        uses: actions/cache@v4
        with:
          path: |
            .turbo/cache
            .cache/gate/passed
          key: turbo-${{ runner.os }}-test-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-test-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Run the test stage
        run: |
          if ! node scripts/gate.mjs full --here --only test; then
            cat .cache/gate/runs/*/test.log
            exit 1
          fi

  proof:
    name: Regression proof
    # CI proves only pull requests from fix/ branches. Direct pushes to main are proved only
    # by the push hook when the local branch name starts with fix/.
    if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'fix/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROOF_BRANCH: ${{ github.head_ref }}
      PROOF_BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      # Proof compares the actual fix branch, not GitHub's synthetic merge commit.
      - name: Checkout branch history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The stage creates disposable databases on its own Docker PostgreSQL server.
      - name: Prove each changed regression test
        run: node scripts/gate.mjs full --here --only proof --proof-branch "$PROOF_BRANCH" --proof-base "$(git merge-base HEAD "$PROOF_BASE")"

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The action lists a pull request's commits to scan them; with only `contents: read` GitHub
    # answered 403 and the scan never ran.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
