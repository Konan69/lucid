name: Mobile iOS sideload

# Builds the unsigned iPhone app for one Vivid. The file it uploads is signed and installed over
# USB by the person who downloads it, so the build needs no Apple account. Ported from
# `mobile-ios-sideload.yml` in the T3 Code fork.
#
# The build is made for the server named in the `VIVID_SERVER` repository variable: that address
# is where the app signs in and where it asks for over-the-air updates (`apps/mobile/app.config.ts`).

on:
  workflow_dispatch:
  # A manual run is only offered for a workflow on the default branch. Until this one is there, a
  # push that touches this file is the way to ask for a build.
  push:
    paths: [.github/workflows/sideload.yml]

permissions:
  contents: read

concurrency:
  group: sideload-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_NO_TELEMETRY: '1'
  NODE_OPTIONS: --max-old-space-size=8192
  VIVID_SERVER: ${{ vars.VIVID_SERVER }}

jobs:
  ipa:
    name: Build unsigned IPA
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Require the server address
        run: |
          if [ -z "$VIVID_SERVER" ]; then
            echo "Set the VIVID_SERVER repository variable to the address of the Vivid this build is for." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @vivid/mobile...

      - name: Generate the iOS project
        working-directory: apps/mobile
        run: node scripts/native.mjs ios --prebuild-only

      # The address is written into the native project by the step above. A build without it can
      # never update, so stop here instead of handing out such a file.
      - name: Verify the embedded update address
        working-directory: apps/mobile
        run: |
          expo_plist="$(find ios -name Expo.plist -print -quit)"
          if [ -z "$expo_plist" ]; then
            echo "Generated Expo.plist was not found." >&2
            exit 1
          fi
          embedded="$(/usr/libexec/PlistBuddy -c 'Print :EXUpdatesURL' "$expo_plist")"
          expected="${VIVID_SERVER%/}/api/updates/manifest"
          if [ "$embedded" != "$expected" ]; then
            echo "Expected update address '$expected', found '$embedded'." >&2
            exit 1
          fi
          echo "Runtime version: $(/usr/libexec/PlistBuddy -c 'Print :EXUpdatesRuntimeVersion' "$expo_plist")"

      - name: Install CocoaPods dependencies
        working-directory: apps/mobile/ios
        run: pod install

      # The file this workflow hands out is installed on a phone nobody here can watch, and a
      # build can compile and still end on its first screen. So the same source is built for a
      # simulator first and opened there, with the settings the phone gets. It passes only if the
      # app's process lasts the whole window and no fatal error was recorded while it started.
      #
      # "Did not end" has no event to wait for, so the check is a window of time, and the one
      # timer below is that window. expo-updates holds a failed launch for up to five seconds
      # before it ends the app (`ErrorRecovery.RemoteLoadTimeoutMs`), so the window is several
      # times that. A screen that cannot be drawn but is caught by the app's own boundary
      # (`ui/Recover.tsx`) keeps the process alive and is not seen here.
      - name: Choose a simulator
        id: simulator
        run: |
          udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          best = None
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device["name"].startswith("iPhone"):
                      key = (runtime, device["name"])
                      if best is None or key > best[0]:
                          best = (key, device["udid"])
          print(best[1] if best else "")
          ')"
          if [ -z "$udid" ]; then
            echo "No iPhone simulator is installed on this runner." >&2
            exit 1
          fi
          xcrun simctl list devices available | grep "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Build for the simulator
        working-directory: apps/mobile
        run: |
          workspace="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          if [ -z "$workspace" ]; then
            echo "No generated Xcode workspace found." >&2
            exit 1
          fi
          scheme="$(basename "$workspace" .xcworkspace)"
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/simulator" \
            build

      - name: Open the app on the simulator
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          app="$(find "$RUNNER_TEMP/simulator/Build/Products/Release-iphonesimulator" -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$app" ]; then
            echo "No built simulator app found." >&2
            exit 1
          fi
          bundle="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")"
          process="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
          out="$RUNNER_TEMP/launch"
          closed="$RUNNER_TEMP/window-closed"
          mkdir -p "$out"
          # Starts the simulator when it is not running, and returns once it is ready.
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$app"
          xcrun simctl spawn "$UDID" log stream --level debug --style compact \
            --predicate "process == \"$process\"" > "$out/device.log" 2>&1 &
          stream=$!
          # `--console` holds until the app's process ends, so its return is the app ending and
          # nothing is polled. A launch that is refused returns at once and reads as an end too.
          xcrun simctl launch --console "$UDID" "$bundle" > "$out/console.log" 2>&1 &
          launch=$!
          # The window closing: it marks that the app lasted, takes the picture of what the app
          # drew, and ends the wait. The signal passes through `simctl` to the app.
          (
            sleep 45
            : > "$closed"
            xcrun simctl io "$UDID" screenshot "$out/screen.png" || true
            kill "$launch" 2>/dev/null || true
          ) > /dev/null 2>&1 &
          timer=$!
          wait "$launch" || true
          kill "$timer" 2>/dev/null || true
          kill "$stream" 2>/dev/null || true
          data="$(xcrun simctl get_app_container "$UDID" "$bundle" data 2>/dev/null || true)"
          if [ -n "$data" ]; then
            find "$data" -name 'expo-error.log' -exec cp {} "$out/" \; 2>/dev/null || true
          fi
          # A living process is not enough: expo-updates can hold a fatal error from the build's
          # own JavaScript and carry on in the same process with an update it downloads. It
          # writes every such error to `expo-error.log` first (`ErrorRecovery.handle`).
          verdict=""
          if [ ! -f "$closed" ]; then
            verdict="The app ended before the window closed."
          elif [ -s "$out/expo-error.log" ]; then
            verdict="The app stayed open, but recorded a fatal error while it started."
          elif grep -q -E 'Unhandled JS Exception|Terminating app due to uncaught exception' "$out/device.log" "$out/console.log"; then
            verdict="The app stayed open, but its log holds a fatal error."
          fi
          if [ -z "$verdict" ]; then
            echo "The app was open for the whole window and recorded no fatal error."
            exit 0
          fi
          echo "::error::$verdict"
          if [ ! -f "$closed" ]; then
            xcrun simctl io "$UDID" screenshot "$out/screen.png" > /dev/null 2>&1 || true
            # The crash report is written by a separate process a moment after the app ends.
            # The verdict above never depends on it: this only waits so the report can be shown.
            for attempt in $(seq 1 30); do
              report="$(find "$HOME/Library/Logs/DiagnosticReports" -name "$process*.ips" -print -quit 2>/dev/null || true)"
              [ -n "$report" ] && break
              sleep 1
            done
            find "$HOME/Library/Logs/DiagnosticReports" -name "$process*.ips" -exec cp {} "$out/" \; 2>/dev/null || true
          fi
          echo "----- expo-error.log"
          cut -c1-4000 "$out/expo-error.log" 2>/dev/null || true
          echo "----- app output"
          tail -n 40 "$out/console.log" | cut -c1-1500 || true
          echo "----- device log: the fatal error"
          grep -n -i -E 'terminating app|uncaught exception|RCTFatal|Unhandled JS|Invariant|TypeError|ReferenceError|abort|fatal' "$out/device.log" | cut -c1-1500 | head -60 || true
          echo "----- device log: last lines"
          tail -n 60 "$out/device.log" | cut -c1-600 || true
          echo "----- crash report"
          for ips in "$out"/*.ips; do
            [ -f "$ips" ] || continue
            python3 - "$ips" <<'PY'
          import json, sys
          text = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          head, _, body = text.partition("\n")
          report = json.loads(body)
          print(json.loads(head).get("app_name"), report.get("osVersion", {}).get("train"))
          print("exception:", json.dumps(report.get("exception")))
          print("termination:", json.dumps(report.get("termination")))
          print("asi:", json.dumps(report.get("asi"))[:3000])
          images = report.get("usedImages", [])
          def frames(items):
              for frame in items[:45]:
                  image = images[frame["imageIndex"]].get("name", "?") if frame.get("imageIndex", -1) < len(images) else "?"
                  print("   ", image, frame.get("symbol", hex(frame.get("imageOffset", 0))))
          last = report.get("lastExceptionBacktrace")
          if last:
              print("last exception backtrace:")
              frames(last)
          for thread in report.get("threads", []):
              if thread.get("triggered"):
                  print("crashed thread:", thread.get("name") or thread.get("queue"))
                  frames(thread.get("frames", []))
          PY
          done
          exit 1

      - name: Keep what the simulator showed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Vivid-simulator-launch
          path: ${{ runner.temp }}/launch
          if-no-files-found: ignore
          retention-days: 14

      - name: Build the unsigned app
        working-directory: apps/mobile
        run: |
          workspace="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          if [ -z "$workspace" ]; then
            echo "No generated Xcode workspace found." >&2
            exit 1
          fi
          scheme="$(basename "$workspace" .xcworkspace)"
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= \
            build

      - name: Package the IPA
        run: |
          app="$(find "$RUNNER_TEMP/derived/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$app" ]; then
            echo "No built iOS app found." >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$app" "$RUNNER_TEMP/ipa/Payload/$(basename "$app")"
          (
            cd "$RUNNER_TEMP/ipa"
            zip -qry "$GITHUB_WORKSPACE/Vivid.ipa" Payload
          )
          unzip -tq "$GITHUB_WORKSPACE/Vivid.ipa"

      - name: Upload the IPA
        uses: actions/upload-artifact@v4
        with:
          name: Vivid-unsigned-ipa
          path: Vivid.ipa
          if-no-files-found: error
          retention-days: 14
