appId: com.vivid.app
productName: Vivid
directories:
  output: release
  buildResources: build

files:
  - dist/main/**
  - dist/preload/**
  - package.json

asar: true

protocols:
  name: Vivid URL
  schemes:
    - vivid

extraResources:
  # Shared design tokens remain the only source for native window colors.
  - from: dist/tokens.css
    to: design-tokens/tokens.css
  # Build stages one complete renderer snapshot alongside the shell bundles.
  - from: dist/renderer
    to: web/dist

linux:
  executableName: vivid
  target:
    - AppImage
  category: Utility
  maintainer: Vivid

mac:
  target:
    - dmg
  category: public.app-category.productivity

win:
  target:
    - nsis
