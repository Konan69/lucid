appId: com.vivid.app
productName: Vivid
directories:
  output: release
  buildResources: build

files:
  - dist/main/**
  - dist/preload/**
  - package.json

asar: true

# The address a packaged Vivid opens on first launch, so nobody is asked for one. Main reads it
# from the packaged manifest (`shippedHome` in src/main/main.ts); File > Use a Different Vivid
# still changes it.
extraMetadata:
  vividHome: https://vivid-server-production.up.railway.app

protocols:
  name: Vivid URL
  schemes:
    - vivid

extraResources:
  # Shared design tokens remain the only source for native window colors.
  - from: dist/tokens.css
    to: design-tokens/tokens.css
  # Build stages one complete renderer snapshot alongside the shell bundles.
  - from: dist/renderer
    to: web/dist

linux:
  executableName: vivid
  target:
    - AppImage
  category: Utility
  maintainer: Vivid

mac:
  target:
    - dmg
  category: public.app-category.productivity

# A Windows app without Vivid's helper would say nothing and simply not work in apps, so the
# packaged result is checked (scripts/packed.mjs) and the build fails when the helper is absent.
afterPack: ./scripts/packed.mjs

win:
  target:
    - nsis
  extraResources:
    # Vivid's Windows helper, compiled by scripts/build.mjs on Windows. Main starts it from
    # `resources/native/windows` (src/main/helper.ts).
    - from: dist/native/windows
      to: native/windows
      filter:
        - Vivid.Windows.exe
