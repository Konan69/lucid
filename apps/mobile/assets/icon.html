<!doctype html>
<!-- Launcher export of apps/web/src/ui/Face.tsx at size 640; light accent token.
     Render at 1024 x 1024 to regenerate icon.png. This is the existing Vivid face. -->
<meta charset="utf-8">
<style>
body { margin: 0; width: 1024px; height: 1024px; display: grid; place-items: center; background: #ffffff; }
.face { position: relative; width: 640px; height: 640px; border-radius: 50%; background: #5b4bff; background-image: radial-gradient(circle at 32% 28%, rgb(255 255 255 / .28), transparent 55%); box-shadow: inset 0 -1px 2px rgb(0 0 0 / .25), 0 1px 2px rgb(0 0 0 / .18); }
.eyes { position: absolute; display: flex; gap: 141px; top: 38%; left: 50%; transform: translateX(-50%); }
i { display: block; width: 70px; height: 154px; border-radius: 999px; background: #0f0f0f; transform: rotate(-6deg); }
i + i { transform: rotate(6deg); }
</style>
<div class="face"><div class="eyes"><i></i><i></i></div></div>
