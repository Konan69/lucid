packages:
  - 'apps/desktop'
  - 'apps/mobile'
  - 'apps/server'
  - 'apps/web'
  - 'packages/contracts'
  - 'packages/client/rpc'
  - 'packages/computer/state'
  - 'packages/client/state'
  - 'packages/design/marks'
  - 'packages/design/tokens'
  - 'packages/agent/runtime'

# pnpm 12 reads project settings here. Keep registry credentials only in an
# untracked .npmrc when a private registry eventually requires them.
autoInstallPeers: false
strictPeerDependencies: true
# Strict peers stay on. These three are transitive peers of tools we do not run:
# @shadcn/lint's ESLint parser (we load it through oxlint), Flue's decorator
# transform, and alchemy's Cloudflare types pin.
peerDependencyRules:
  ignoreMissing:
    - eslint
    - '@babel/core'
  allowedVersions:
    '@cloudflare/workers-types': '5'
verifyDepsBeforeRun: false
pmOnFail: error

# Every repeated stack pin has one owner. Manifests reference these entries with
# catalog: so Effect/Drizzle/Flue/native TypeScript cannot drift by package.
catalog:
  '@alchemy.run/better-auth': 2.0.0-beta.79
  '@earendil-works/pi-ai': 0.83.0
  '@effect/atom-react': 4.0.0-rc.116
  '@effect/platform-node': 4.0.0-rc.116
  '@effect/sql-pg': 4.0.0-rc.116
  '@effect/vitest': 4.0.0-rc.116
  '@flue/cli': 2.1.0
  '@flue/postgres': 2.1.0
  '@flue/react': 2.1.0
  '@flue/runtime': 2.1.0
  '@flue/sdk': 2.1.0
  '@flue/vite': 2.1.0
  '@react-native/metro-config': 0.86.3
  '@react-navigation/native': 7.4.1
  '@react-navigation/native-stack': 7.19.2
  '@tailwindcss/vite': 4.3.3
  '@types/node': 24.13.6
  '@types/pg': 8.23.1
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.3
  '@typescript/native': 'npm:typescript@7.0.2'
  '@vitejs/plugin-react': 6.1.1
  alchemy: 2.0.0-beta.79
  better-auth: 1.7.5
  drizzle-kit: 1.0.0-rc.5-ab785fc
  drizzle-orm: 1.0.0-rc.5-ab785fc
  effect: 4.0.0-rc.116
  electron: 44.4.3
  electron-builder: 26.15.3
  electron-builder-squirrel-windows: 26.15.3
  esbuild: 0.28.2
  expo: 57.0.24
  expo-crypto: 57.0.3
  expo-dev-client: 57.0.19
  expo-document-picker: 57.0.2
  expo-file-system: 57.0.7
  expo-haptics: 57.0.3
  expo-secure-store: 57.0.4
  expo-sharing: 57.0.21
  expo-system-ui: 57.0.4
  hono: 4.12.32
  konsistent: 1.0.0-beta.9
  lucide-react: 1.47.0
  lucide-react-native: 1.47.0
  pg: 8.23.0
  react: 19.2.3
  react-dom: 19.2.3
  react-native: 0.86.3
  react-native-gesture-handler: 2.32.0
  react-native-reanimated: 4.5.1
  react-native-web: 0.21.2
  react-native-worklets: 0.10.1
  tailwindcss: 4.3.3
  tsx: 4.23.13
  typescript: 6.0.3
  valibot: 1.5.0
  vite: 8.3.0
  vitest: 5.0.1

# Root-only convergence keeps transitive peers on the same RCs as the direct
# stack. Catalog references keep the override and direct declaration identical.
overrides:
  '@effect/platform-node': 'catalog:'
  '@effect/sql-pg': 'catalog:'
  drizzle-kit: 'catalog:'
  drizzle-orm: 'catalog:'
  effect: 'catalog:'

# Only dependencies whose working artifact requires an install script may run
# one. Optional accelerators and donation messages stay blocked.
allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  sharp: true
  workerd: true
  '@google/genai': false
  core-js-pure: false
  msgpackr-extract: false
  protobufjs: false

patchedDependencies:
  '@react-native-menu/menu@2.0.0': patches/@react-native-menu__menu@2.0.0.patch
  react-native-gesture-handler@2.32.0: patches/react-native-gesture-handler@2.32.0.patch
minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@5.20260919.1'
  - '@effect/platform-node-shared@4.0.0-rc.116'
  - '@effect/platform-node@4.0.0-rc.116'
  - '@effect/sql-d1@4.0.0-rc.116'
  - '@effect/sql-pg@4.0.0-rc.116'
  - '@effect/sql-sqlite-do@4.0.0-rc.116'
  - '@effect/vitest@4.0.0-rc.116'
  - '@turbo/darwin-64@2.11.2'
  - '@turbo/darwin-arm64@2.11.2'
  - '@turbo/linux-64@2.11.2'
  - '@turbo/linux-arm64@2.11.2'
  - '@turbo/windows-64@2.11.2'
  - '@turbo/windows-arm64@2.11.2'
  - effect@4.0.0-rc.116
  - turbo@2.11.2
