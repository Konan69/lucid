packages:
  - 'apps/desktop'
  - 'apps/mobile'
  - 'apps/server'
  - 'apps/web'
  - 'packages/compiler'
  - 'packages/contracts'
  - 'packages/client/rpc'
  - 'packages/client/state'
  - 'packages/design/marks'
  - 'packages/design/tokens'
  - 'packages/agent/runtime'
  - 'packages/agent/skills'

# pnpm 12 reads project settings here. Keep registry credentials only in an
# untracked .npmrc when a private registry eventually requires them.
autoInstallPeers: false
strictPeerDependencies: true
# Strict peers stay on. These three are transitive peers of tools we do not run:
# @shadcn/lint's ESLint parser (we load it through oxlint), Flue's decorator
# transform (its Babel 8 plugin sits beside the Babel 7 the phone build uses), and alchemy's
# Cloudflare types pin.
peerDependencyRules:
  ignoreMissing:
    - eslint
    - '@babel/core'
  allowedVersions:
    '@babel/core': '7'
    '@cloudflare/workers-types': '5'
verifyDepsBeforeRun: false
pmOnFail: error

# Every repeated stack pin has one owner. Manifests reference these entries with
# catalog: so Effect/Drizzle/Flue cannot drift by package.
catalog:
  '@alchemy.run/frontend-frameworks': 2.0.0-beta.81
  '@earendil-works/pi-ai': 0.87.1
  '@effect/ai-openrouter': 4.0.2
  '@effect/ai-typesafe': 4.0.2
  '@effect/atom-react': 4.0.2
  '@effect/platform-node': 4.0.2
  '@effect/sql-pg': 4.0.2
  '@effect/vitest': 4.0.2
  '@flue/cli': 2.2.2
  '@flue/postgres': 2.2.2
  '@flue/react': 2.2.2
  '@flue/runtime': 2.2.2
  '@flue/sdk': 2.2.2
  '@flue/vite': 2.2.2
  '@openuidev/cli': 0.4.1
  '@openuidev/lang-core': 1.0.0
  '@openuidev/react-lang': 1.0.0
  '@react-native/metro-config': 0.86.3
  '@react-navigation/native': 7.4.1
  '@react-navigation/native-stack': 7.19.2
  # @sentry/react is held at the core @sentry/electron 8.0.0 is built on (11.1.0): the web bundle
  # loads both inside the desktop app, and two cores there would mean two clients on one page.
  # @sentry/core is named for its envelope and event types, at that same version. The phone app
  # pins its own (10.75.2, the core of @sentry/react-native 8.29.0) in its manifest.
  '@sentry/core': 11.1.0
  '@sentry/electron': 8.0.0
  '@sentry/react': 11.1.0
  '@sentry/react-native': 8.29.0
  '@tailwindcss/vite': 4.3.3
  '@types/node': 24.13.6
  '@types/pg': 8.23.1
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.3
  '@typeonce/effect-machine': 0.46.0
  '@typeonce/effect-machine-react': 0.46.0
  '@typeonce/oxlint-plugin-effect-machine': 0.46.0
  '@vitejs/plugin-react': 6.1.1
  alchemy: 2.0.0-beta.81
  better-auth: 1.7.5
  drizzle-kit: 1.0.0-rc.5-ab785fc
  drizzle-orm: 1.0.0-rc.5-ab785fc
  effect: 4.0.2
  electron: 44.4.3
  electron-builder: 26.15.3
  electron-builder-squirrel-windows: 26.15.3
  esbuild: 0.28.2
  expo: 57.0.24
  expo-audio: 57.0.5
  expo-blur: 57.0.3
  expo-constants: 57.0.19
  expo-crypto: 57.0.3
  expo-dev-client: 57.0.19
  expo-document-picker: 57.0.2
  expo-file-system: 57.0.7
  expo-glass-effect: 57.0.3
  expo-haptics: 57.0.3
  expo-image-manipulator: 57.0.19
  expo-image: 57.0.5
  expo-image-picker: 57.0.19
  expo-location: 57.0.22
  expo-media-library: 57.0.5
  expo-notifications: 57.0.24
  expo-secure-store: 57.0.4
  expo-sharing: 57.0.21
  expo-system-ui: 57.0.4
  expo-updates: 57.0.24
  expo-web-browser: 57.0.3
  hono: 4.13.8
  kysely: 0.29.5
  lucide-react: 1.47.0
  lucide-react-native: 1.47.0
  pg: 8.23.0
  react: 19.2.3
  react-dom: 19.2.3
  react-native: 0.86.3
  react-native-gesture-handler: 2.32.0
  react-native-reanimated: 4.5.1
  react-native-web: 0.21.2
  react-native-worklets: 0.10.1
  tailwindcss: 4.3.3
  tsx: 4.23.13
  valibot: 1.5.0
  vite: 8.3.0
  vitest: 5.0.1

  zod: 4.5.4
# Root-only convergence keeps transitive peers on the same RCs as the direct
# stack. Catalog references keep the override and direct declaration identical.
overrides:
  typescript: '-'
  '@effect/platform-node': 'catalog:'
  # Drizzle's optional Effect adapters. Nothing here imports them, but a copy left on the release
  # candidate would import module paths stable Effect no longer has.
  '@effect/sql-d1': 4.0.2
  '@effect/sql-pg': 'catalog:'
  '@effect/sql-sqlite-do': 4.0.2
  drizzle-kit: 'catalog:'
  drizzle-orm: 'catalog:'
  # Better Auth finds its schema check by the identity of its adapter object; a second jose
  # (pulled in by OpenUI's packages) would make a second copy of that adapter.
  jose: 6.2.10
  effect: 'catalog:'

# Only dependencies whose working artifact requires an install script may run
# one. Optional accelerators and donation messages stay blocked.
allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  sharp: true
  workerd: true
  '@google/genai': false
  # Its install script only reports the install to PostHog; nothing needs it to run.
  '@openuidev/lang-core': false
  # Sentry's command-line tool injects and uploads the source maps the builds produce
  # (`scripts/sentry-upload.mjs`, `apps/web/vite.config.ts`); its install step fetches the
  # prebuilt binary the wrapper runs.
  '@sentry/cli': true
  # tsc-rs's install step only rewrites its launcher to skip a 22 ms Node start; the launcher as
  # shipped finds the platform binary by itself, and scripts/types.mjs runs it with Node.
  tsc-rs: false
  core-js-pure: false
  msgpackr-extract: false
  protobufjs: false
  # Its install step lays down the prebuilt Skia libraries the native mobile build links.
  '@shopify/react-native-skia': true
  # ssh2 runs on its JavaScript ciphers; its optional native accelerators are not built.
  cpu-features: false
  ssh2: false
  # Its install step only downloads what the phone app has switched off in its manifest
  # (`enriched-markdown` in apps/mobile/package.json: syntax grammars and the maths renderer), so
  # there is nothing for it to do.
  'react-native-enriched-markdown@file:apps/mobile/deps/react-native-enriched-markdown-1.2.0-t3.11.tgz': false

patchedDependencies:
  '@flue/runtime@2.2.2': patches/@flue__runtime@2.2.2.patch
  '@openuidev/react-lang@1.0.0': patches/@openuidev__react-lang@1.0.0.patch
  '@react-native-menu/menu@2.0.0': patches/@react-native-menu__menu@2.0.0.patch
  '@react-navigation/native-stack@7.19.2': patches/@react-navigation__native-stack@7.19.2.patch
  react-native-gesture-handler@2.32.0: patches/react-native-gesture-handler@2.32.0.patch
  react-native-screens@4.26.2: patches/react-native-screens@4.26.2.patch
minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@5.20260919.1'
  - '@effect/platform-node-shared@4.0.2'
  - '@effect/platform-node@4.0.2'
  - '@effect/sql-d1@4.0.2'
  - '@effect/sql-pg@4.0.2'
  - '@effect/sql-sqlite-do@4.0.2'
  - '@effect/vitest@4.0.2'
  - '@turbo/darwin-64@2.11.2'
  - '@turbo/darwin-arm64@2.11.2'
  - '@turbo/linux-64@2.11.2'
  - '@turbo/linux-arm64@2.11.2'
  - '@turbo/windows-64@2.11.2'
  - '@turbo/windows-arm64@2.11.2'
  - effect@4.0.2
  - turbo@2.11.2
  - '@earendil-works/pi-codemode@1.0.0'
  - '@tsc-rs/darwin-arm64@0.8.0'
  - '@tsc-rs/linux-x64@0.8.0'
  - tsc-rs@0.8.0
  - '@tsc-rs/darwin-x64@0.8.0'
  - '@tsc-rs/linux-arm64@0.8.0'
  - '@tsc-rs/win32-arm64@0.8.0'
  - '@tsc-rs/win32-x64@0.8.0'
  - '@maschwenk/tsrslint@0.1.5'
  - '@maschwenk/tsrslint-linux-x64@0.1.5'
  - '@maschwenk/tsrslint-linux-arm64@0.1.5'
  - '@maschwenk/tsrslint-darwin-arm64@0.1.5'
